spring:
  application:
    name: url-shortener-service

  datasource:
    url: jdbc:h2:mem:urlshortenerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  url-shortener:
    # Duracao padrao de validade da URL encurtada em dias
    expiration-days: 7
    # Comprimento do codigo encurtado (entre 5 e 10 caracteres conforme requisito)
    code-length: 6

server:
  port: 8084
